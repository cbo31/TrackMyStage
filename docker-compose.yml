services:
  trackmystage_db:
    image: postgres:16-alpine
    container_name: trackmystage_db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  trackmystage_backend:
    build: ./backend
    container_name: trackmystage_backend
    restart: unless-stopped
    volumes:
      - static_files:/TrackMyStage/staticfiles
    env_file:
      - .env
    depends_on:
      trackmystage_db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  trackmystage_nginx:
    build: ./frontend
    container_name: trackmystage_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/maintenance.html:/usr/share/nginx/html/maintenance.html:ro
      - static_files:/usr/share/nginx/html/static
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      trackmystage_backend:
        condition: service_healthy
    healthcheck:
      # Port 80 only redirects to HTTPS; pidof is enough to know nginx is up
      test: ["CMD-SHELL", "pidof nginx > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  static_files:
