services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
  
  backend:
    build: ./backend
    volumes:
      - static_files:/TrackMyStage/staticfiles
    env_file:
      - .env
    depends_on:
      - db
  
  nginx:
    build: ./frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_files:/usr/share/nginx/html/static
      - /etc/letsencrypt:/etc/letsencrypt:ro  
    depends_on:
      - backend
  
volumes:
  postgres_data:
  static_files: